openapi: 3.1.0
info:
  title: Harmonica API
  version: 1.0.0
  description: |
    REST API for the Harmonica structured deliberation platform.
    Provides access to sessions and their data, including creating, updating, and querying sessions, plus response submission for active sessions.
  contact:
    name: Harmonica
    url: https://harmonica.chat

servers:
  - url: https://app.harmonica.chat/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        API key authentication. Pass your key as a Bearer token.
        Keys use the format `hm_live_<32 hex chars>`.
        Generate keys from your Harmonica dashboard settings.

    chainParticipantToken:
      type: apiKey
      in: header
      name: x-chain-participant-token
      description: >-
        Signed identity from an existing chain invitation. Only supported by
        the BMC read operation; the server rechecks chain membership, withdrawal,
        round eligibility and participant sharing. It grants no workspace role.

  schemas:
    BmcId:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque identity; knowing an ID does not grant access.
    BmcBlockId:
      type: string
      enum: [key_partnerships, key_activities, key_resources, value_propositions, customer_relationships, channels, customer_segments, cost_structure, revenue_streams]
    BmcEvidenceKind:
      type: string
      enum: [unknown, hypothesis, estimate, reported, observed]
      description: Recorded evidence basis, separate from human confirmation of wording; not independent market validation.
    BmcReviewStatus:
      type: string
      enum: [proposed, confirmed]
      description: Human review of the entry's wording. Confirmation does not change an estimate or hypothesis into verified evidence.
    BmcSourceRef:
      type: object
      additionalProperties: false
      required: [kind, stepId, stepIndex, sessionId, summaryDigest]
      description: Group-summary provenance, not an original contribution reference or permission to read a private transcript.
      properties:
        kind: { type: string, enum: [group_summary] }
        stepId: { $ref: '#/components/schemas/BmcId' }
        stepIndex: { type: integer, minimum: 0 }
        sessionId: { $ref: '#/components/schemas/BmcId' }
        summaryDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
    BmcModel:
      type: object
      additionalProperties: false
      required: [id, name, description, status]
      properties:
        id: { $ref: '#/components/schemas/BmcId' }
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 3000 }
        status: { type: string, enum: [current, proposed] }
    BmcEntry:
      type: object
      additionalProperties: false
      required: [id, modelId, blockId, label, detail, evidenceKind, reviewStatus, dispute, sourceRefs, linkedEntryIds, hostFields]
      description: An identifiable account within one model. Alternative models retain separate identities; unknown blocks may contain no entries.
      properties:
        id: { $ref: '#/components/schemas/BmcId' }
        modelId: { $ref: '#/components/schemas/BmcId' }
        blockId: { $ref: '#/components/schemas/BmcBlockId' }
        label: { type: string, minLength: 1, maxLength: 300 }
        detail: { type: [string, 'null'], maxLength: 5000 }
        evidenceKind: { $ref: '#/components/schemas/BmcEvidenceKind' }
        reviewStatus: { $ref: '#/components/schemas/BmcReviewStatus' }
        dispute: { type: [string, 'null'], maxLength: 3000 }
        sourceRefs:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/BmcSourceRef' }
        linkedEntryIds:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BmcId' }
        hostFields:
          type: array
          maxItems: 7
          description: Fields protected by explicit human edits; conflicting later extraction remains a proposal.
          items:
            type: string
            enum: [blockId, label, detail, evidenceKind, reviewStatus, dispute, linkedEntryIds]
        hostAuthored:
          type: boolean
          description: Present on entries added by an editor without invented group-summary provenance.
    BmcLink:
      type: object
      additionalProperties: false
      required: [fromEntryId, toEntryId]
      properties:
        fromEntryId: { $ref: '#/components/schemas/BmcId' }
        toEntryId: { $ref: '#/components/schemas/BmcId' }
    BmcRevision:
      type: object
      additionalProperties: false
      required: [id, number, createdAt, models, entries, links]
      description: >-
        One immutable Canvas revision. Model and entry identities are unique;
        links must match linkedEntryIds and resolve to entries in the same model.
      properties:
        id: { $ref: '#/components/schemas/BmcId' }
        number: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        models:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/BmcModel' }
        entries:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BmcEntry' }
        links:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/BmcLink' }
        sourceRefs:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/BmcSourceRef' }
    BmcExtractionState:
      type: object
      additionalProperties: false
      required: [source, status, baseRevisionId, error]
      properties:
        source: { $ref: '#/components/schemas/BmcSourceRef' }
        status: { type: string, enum: [pending, ready, error] }
        baseRevisionId: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        error: { type: [string, 'null'], maxLength: 100 }
        claimedAt: { type: string, format: date-time }
        rebuild: { type: boolean }
    BmcState:
      type: object
      additionalProperties: false
      required: [version, participantSharingEnabled, current, revisions, reviewedRevisionId, closingRevisionId, roundBindings, extractions]
      description: >-
        Source-filtered state. A participant receives only the requested authorized
        review or approved closing revision, with no candidate history or extraction
        receipts. Management reads can include current preparation/history.
        Revision bindings refer to retained revisions; extraction keys are the
        decimal source stepIndex. Tombstones protect human removals on regeneration.
      properties:
        version: { type: integer, enum: [1] }
        participantSharingEnabled: { type: boolean, default: true }
        current:
          anyOf:
            - $ref: '#/components/schemas/BmcRevision'
            - type: 'null'
        revisions:
          type: array
          items: { $ref: '#/components/schemas/BmcRevision' }
        reviewedRevisionId: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        closingRevisionId: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        roundBindings:
          type: object
          description: Zero-based review step index (1 or later) mapped to its immutable revision ID; build-model has index 0 and no review binding.
          additionalProperties: { $ref: '#/components/schemas/BmcId' }
        removedEntryIds:
          type: array
          items: { $ref: '#/components/schemas/BmcId' }
        removedEntryKeys:
          type: array
          items: { type: string, pattern: '^[a-f0-9]{64}$' }
        extractions:
          type: object
          additionalProperties: { $ref: '#/components/schemas/BmcExtractionState' }
    BmcPreparation:
      type: object
      additionalProperties: false
      required: [stepIndex, title, status, canPrepare]
      properties:
        stepIndex: { type: integer, minimum: 0 }
        title: { type: string }
        status: { type: string, enum: [not_prepared, pending, ready, error, stale, unavailable] }
        canPrepare:
          type: boolean
          description: Advisory editor action eligibility, rechecked under lock when preparing. A new model call may incur cost.
    BmcReadResponse:
      type: object
      additionalProperties: false
      required: [state, canEdit, canApproveClosing, sourceStatus, management, preparation, boundSnapshotHeld, boundSnapshotMessage]
      properties:
        state:
          description: Null when current source changes withhold the saved Canvas; management and readiness remain available for recovery.
          anyOf:
            - $ref: '#/components/schemas/BmcState'
            - type: 'null'
        canEdit: { type: boolean }
        canApproveClosing:
          type: boolean
          description: True only when an editor may approve the current closing Canvas after a completed chain and current final extraction.
        sourceStatus: { type: string, enum: [current, changed] }
        management:
          type: object
          additionalProperties: false
          required: [expectedRevision, participantSharingEnabled]
          properties:
            expectedRevision: { type: integer, minimum: 0 }
            participantSharingEnabled: { type: boolean }
        preparation:
          type: array
          description: Per-round management status; empty for participant projections.
          items: { $ref: '#/components/schemas/BmcPreparation' }
        boundSnapshotHeld:
          type: boolean
          description: A bound review snapshot has a changed source. Preparing a replacement does not replace that immutable binding; restart in a fresh chain to continue the affected round.
        boundSnapshotMessage: { type: [string, 'null'] }
    BmcHostEntryEdit:
      type: object
      additionalProperties: false
      required: [entryId]
      properties:
        entryId: { $ref: '#/components/schemas/BmcId' }
        blockId: { $ref: '#/components/schemas/BmcBlockId' }
        label: { type: string, minLength: 1, maxLength: 300 }
        detail: { type: [string, 'null'], maxLength: 5000 }
        evidenceKind: { $ref: '#/components/schemas/BmcEvidenceKind' }
        reviewStatus: { $ref: '#/components/schemas/BmcReviewStatus' }
        dispute: { type: [string, 'null'], maxLength: 3000 }
        linkedEntryIds:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BmcId' }
    BmcHostEntryAddition:
      type: object
      additionalProperties: false
      required: [modelId, blockId, label, evidenceKind]
      description: Adds an entry to an existing model with a server-generated entry ID and no invented source reference. Defaults to confirmed wording when reviewStatus is omitted.
      properties:
        modelId: { $ref: '#/components/schemas/BmcId' }
        blockId: { $ref: '#/components/schemas/BmcBlockId' }
        label: { type: string, minLength: 1, maxLength: 300 }
        detail: { type: [string, 'null'], maxLength: 5000 }
        evidenceKind: { $ref: '#/components/schemas/BmcEvidenceKind' }
        dispute: { type: [string, 'null'], maxLength: 3000 }
        reviewStatus: { $ref: '#/components/schemas/BmcReviewStatus' }
    BmcEditRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, edits]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          description: Latest management.expectedRevision from a read. A stale value returns 409; zero permits a sharing-only change before any Canvas exists.
        edits:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BmcHostEntryEdit' }
        additions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BmcHostEntryAddition' }
        removeEntryIds:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BmcId' }
        approve:
          type: boolean
          description: Mark the resulting revision reviewed for the next dependent round; does not establish participant agreement or market validation.
        closing:
          type: boolean
          description: Requires approve=true, a completed chain and current final extraction; makes the resulting revision the approved closing Canvas.
        participantSharingEnabled:
          type: boolean
          description: Controls participant Canvas reads, including closing access. Send edits=[] for a sharing-only change, without generating a model revision or model call.
    BmcPrepareRequest:
      type: object
      additionalProperties: false
      required: [stepIndex]
      properties:
        stepIndex: { type: integer, minimum: 0 }
        retry:
          type: boolean
          description: Must be explicitly true for an authenticated editor request, including first preparation. Missing or false returns explicit_retry_required.
    BmcPrepareResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, ready, error] }
        revision:
          type: integer
          minimum: 0
          description: Current revision number after a claimed extraction finishes; omitted for an unchanged existing claim. Ready does not mean human approval.
    BmcError:
      type: object
      additionalProperties: false
      required: [error, code]
      description: BMC operation errors use this flat envelope. Authenticator failures on writes and rate limits use the standard nested Error envelope.
      properties:
        error: { type: string }
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, validation_error, explicit_retry_required, bmc_changed, bmc_invalid_edit, bmc_source_missing, bmc_extraction_pending, bmc_extraction_failed, bmc_source_changed, bmc_review_required, bmc_snapshot_missing, bmc_sharing_disabled, internal_error]
    StakeholderMapEntry:
      type: object
      additionalProperties: false
      required: [id, label, influence, interest, stance, perspective, concerns, engagementProposal, evidenceCount, hostEditedFields]
      description: A reported account, not a verified position or agreed engagement decision. Conflicting accounts may share a label.
      properties:
        id:
          type: string
          description: Opaque native entry identity, not a participant or source-message ID.
        label:
          type: string
          maxLength: 300
        influence:
          type: [string, 'null']
          enum: [low, medium, high, null]
          description: Null means unknown and remains unplaced.
        interest:
          type: [string, 'null']
          enum: [low, medium, high, null]
        stance:
          type: string
          enum: [supportive, neutral, resistant, unknown]
        perspective:
          type: string
          enum: [self_reported, reported_by_others, unclear]
          description: Describes the recorded account; self_reported does not verify a named person's identity.
        concerns:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 2000
        engagementProposal:
          type: [string, 'null']
          maxLength: 4000
          description: A reported proposal, without assigned responsibility or authorization to act.
        evidenceCount:
          type: integer
          minimum: 0
          description: Current supporting references, not votes. Public and participant entries always have at least one; an editor's saved review entry may have none.
        hostEditedFields:
          type: array
          items:
            type: string
            enum: [label, influence, interest, stance, perspective, concerns, engagementProposal]
        sourceStatus:
          type: string
          enum: [current, needs_review]
          description: Editor-only review status; omitted from public and participant responses.
        evidenceQuotes:
          type: array
          description: Editor-only source excerpts. Never included for public readers, community members or participants solely by virtue of that access.
          items:
            type: object
            additionalProperties: false
            required: [messageId, text]
            properties:
              messageId:
                type: string
              text:
                type: string
    StakeholderMapArtifact:
      type: object
      additionalProperties: false
      required: [kind, schemaVersion, title, revision, generatedAt, sourceStatus, coverage, items]
      properties:
        kind:
          type: string
          enum: [stakeholder-engagement]
        schemaVersion:
          type: integer
          enum: [1]
        title:
          type: [string, 'null']
        revision:
          type: integer
          minimum: 0
        generatedAt:
          type: [integer, 'null']
          description: Unix epoch milliseconds of the latest successful extraction; null before generation.
        sourceStatus:
          type: string
          enum: [current, changed, not_generated]
          description: Changed source answers withhold public and participant items until regeneration. Editors can inspect explicitly flagged saved content.
        coverage:
          type: [object, 'null']
          additionalProperties: false
          description: Safe counts from the latest extraction, without source identities or fingerprints. Null before generation; partial coverage must not imply all perspectives were reviewed.
          required: [eligibleMessages, extractedMessages]
          properties:
            eligibleMessages:
              type: integer
              minimum: 0
            extractedMessages:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/StakeholderMapEntry'
    StakeholderMapResponse:
      type: object
      additionalProperties: false
      required: [artifact, canEdit, canRegenerate]
      properties:
        artifact:
          $ref: '#/components/schemas/StakeholderMapArtifact'
        canEdit:
          type: boolean
        canRegenerate:
          type: boolean
        review:
          type: object
          additionalProperties: false
          description: Editor-only source/current-state fence for the host correction UI; omitted for other readers.
          required: [editToken, coverage]
          properties:
            editToken:
              type: string
              pattern: '^[a-f0-9]{64}$'
            coverage:
              type: object
              additionalProperties: false
              required: [eligibleMessages, extractedMessages, sourceFingerprint]
              properties:
                eligibleMessages:
                  type: integer
                  minimum: 0
                extractedMessages:
                  type: integer
                  minimum: 0
                sourceFingerprint:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
    StakeholderMapError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_found, host_only, participants_only, community_gated, private_results, editor_required, summary_required, no_participant_answers, invalid_request, stakeholder_changed, internal_error]
    ChainBlocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [chain_not_active, step_not_active, invalid_snapshot, unassigned_roles, completion_not_met, summary_required, summary_preparing, no_participant_answers, bmc_source_missing, bmc_extraction_pending, bmc_extraction_failed, bmc_source_changed, bmc_review_required, bmc_snapshot_missing]
        message: { type: string }
        step_id: { type: string }
        session_id: { type: [string, 'null'] }
    ChainStepState:
      type: object
      required: [step_id, step_index, template_step_id, session_id, status, title]
      properties:
        step_id: { type: string }
        step_index: { type: integer }
        template_step_id: { type: string }
        session_id: { type: [string, 'null'] }
        status:
          type: string
          enum: [pending, active, awaiting, completed, failed, skipped]
        title: { type: string }
    ChainControlState:
      type: object
      required: [chain_id, status, current_step_index, current_step_id, current_session_id, can_advance, blockers, completion_type, total_assignments, completed_assignments, required_assignments, timer_ready_at, steps]
      properties:
        chain_id: { type: string }
        status:
          type: string
          enum: [pending, active, awaiting, paused, completed, failed, cancelled]
        current_step_index: { type: integer }
        current_step_id: { type: [string, 'null'] }
        current_session_id: { type: [string, 'null'] }
        can_advance:
          type: boolean
          description: Advisory snapshot; eligibility is rechecked under the chain lock when continuing.
        can_start_summary:
          type: boolean
          description: The chain can accept Continue and prepare sealed feedback before advancing.
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/ChainBlocker'
        completion_type:
          type: string
          enum: [host_continue, all_submitted, timer, quorum, quorum_percent]
        total_assignments: { type: integer }
        completed_assignments: { type: integer }
        required_assignments:
          type: [integer, 'null']
          description: Completion threshold for assignment-based gates; zero assignments still cannot complete an automatic gate.
        timer_ready_at: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ChainStepState'
    ChainHostAdvanceReceipt:
      type: object
      required: [chain_id, from_step_id, action, next_step_id, next_session_id, actor_id, auth_method, source, occurred_at, replayed]
      properties:
        chain_id: { type: string }
        from_step_id: { type: string }
        action:
          type: string
          enum: [advanced, closed]
        next_step_id: { type: [string, 'null'] }
        next_session_id: { type: [string, 'null'] }
        actor_id: { type: string }
        auth_method:
          type: string
          enum: [session, api_key]
        source:
          type: string
          enum: [api, mcp]
          description: Original committing transport; replay preserves the original actor and source.
        occurred_at: { type: string, format: date-time }
        replayed: { type: boolean }
    ChainControlError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [forbidden, not_found, invalid_request, validation_error, stale_step, transition_blocked, advance_failed, internal_error]
            message: { type: string }
            blockers:
              type: array
              items:
                $ref: '#/components/schemas/ChainBlocker'
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        goal:
          type: string
        critical:
          type: string
          nullable: true
        context:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
          description: Custom facilitation prompt for the session's AI facilitator
        status:
          type: string
          enum: [active, completed]
        summary:
          type: string
          nullable: true
        session_md:
          type: string
          nullable: true
          description: Structured SESSION.md brief (auto-generated after summary)
        participant_links_enabled:
          type: boolean
          description: Whether pasted participant links can be read and added as shared sources. Defaults to true.
        participant_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, topic, goal, status, participant_count, created_at, updated_at]

    SessionListItem:
      type: object
      description: Abbreviated session object returned in list endpoints.
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active, completed]
        participant_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, topic, goal, status, participant_count, created_at, updated_at]

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        facilitation_prompt:
          type: string
          nullable: true
        default_session_name:
          type: string
          nullable: true
        default_goal:
          type: string
          nullable: true
        default_critical:
          type: string
          nullable: true
        default_context:
          type: string
          nullable: true
        template_type:
          type: string
          description: 'single or chain'
        chain_config:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChainConfig'
          description: Chain definition for chain templates; null for single templates (HAR-1098).
        cross_pollination_default:
          type: boolean
        is_public:
          type: boolean
        workspace_id:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        source_provenance:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SourceProvenance'
          description: Provenance for a template installed from the OFL method-specs registry; null for admin-authored templates (HAR-1108).
        drift_status:
          type: string
          enum: [unchanged, modified, unverified]
          description: Install-baseline status. Legacy single or unknown baselines are unverified.
        current_content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Full current content fingerprint for a reviewed reinstall; not authorization or source authenticity.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, title, template_type, cross_pollination_default, is_public, created_at, updated_at]

    SourceProvenance:
      type: object
      description: Provenance for a template installed from the OFL method-specs registry. Null for admin-authored templates.
      properties:
        spec_id: { type: string }
        spec_version: { type: string }
        registry: { type: string }
        install_hash:
          type: string
          description: SHA-256 of single-template content when hash_kind is single-template-v1; otherwise legacy chain_config only.
        hash_kind:
          type: string
          enum: [single-template-v1]
          description: Absent on legacy chain baselines. An absent tag never verifies a single baseline.
        installed_at:
          type: string
          format: date-time
        installed_by:
          type: string
          nullable: true

    CreateTemplateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        facilitation_prompt:
          type: string
          nullable: true
        default_session_name:
          type: string
          nullable: true
        default_goal:
          type: string
          nullable: true
        default_critical:
          type: string
          nullable: true
        default_context:
          type: string
          nullable: true
        is_public:
          type: boolean
          default: false
        workspace_id:
          type: string
          nullable: true
          description: When set, creates a workspace-scoped template (caller must be a workspace admin).
        template_type:
          type: string
          enum: [single, chain]
          description: Pass 'chain' (with chain_config) to install a chain method-spec (HAR-1098). Defaults to 'single'.
        chain_config:
          $ref: '#/components/schemas/ChainConfig'
        source_provenance:
          type: object
          description: Spec identity for a registry install; the server stamps install_hash + timestamps (HAR-1108).
          properties:
            spec_id: { type: string }
            spec_version: { type: string }
            registry: { type: string }
          required: [spec_id, spec_version, registry]
      required: [title]

    UpdateTemplateRequest:
      type: object
      description: All fields optional; at least one must be provided.
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        facilitation_prompt:
          type: string
          nullable: true
        default_session_name:
          type: string
          nullable: true
        default_goal:
          type: string
          nullable: true
        default_critical:
          type: string
          nullable: true
        default_context:
          type: string
          nullable: true
        is_public:
          type: boolean
        template_type:
          type: string
          enum: [single, chain]
          description: Set to 'chain' to convert a single template into a chain (chain_config required) (HAR-1098).
        chain_config:
          $ref: '#/components/schemas/ChainConfig'
        source_provenance:
          type: object
          description: Spec identity for a registry re-install; the server stamps install_hash + timestamps (HAR-1108).
          properties:
            spec_id: { type: string }
            spec_version: { type: string }
            registry: { type: string }
          required: [spec_id, spec_version, registry]
        force:
          type: boolean
          description: Explicit replacement of modified or unverified content. Single reinstalls and type conversions also require matching reviewed proof.
        expected_content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Required with force for modified or unverified singles and source reinstall type conversions. Read current_content_hash, review that content, then submit its value. Concurrent changes refuse the write.

    ChainConfig:
      type: object
      description: >-
        Multi-step chain definition (used when template_type is 'chain').
        Validated server-side (HAR-915): at least one step, unique step ids,
        valid role / assignment / completion shapes.
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
                minLength: 1
              title:
                type: string
              description:
                type: string
              facilitation_prompt:
                type: string
              default_session_name:
                type: string
              context_mode:
                type: string
                enum: [none, previous_summary, all_summaries]
              context_template:
                type: string
              individual_memory:
                type: boolean
              output:
                type: string
                description: Required round-summary output, retained in the immutable chain snapshot.
              may_close_early:
                type: boolean
                description: Method-declared permission to close a participant conversation below the usual message floor after its normal recap/confirmation.
              roles:
                type: array
                items:
                  type: object
                  required: [slug, label]
                  properties:
                    slug:
                      type: string
                      minLength: 1
                    label:
                      type: string
                      minLength: 1
                    weight:
                      type: string
                      enum: [normal, elevated, lead]
              assignment_strategy:
                type: string
                enum: [explicit, round_robin, first_come_first_served, host_assigned, all_participants]
              completion_criteria:
                oneOf:
                  - type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [host_continue] }
                  - type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [all_submitted] }
                  - type: object
                    required: [type, duration_seconds]
                    properties:
                      type: { type: string, enum: [timer] }
                      duration_seconds: { type: number, exclusiveMinimum: 0 }
                  - type: object
                    required: [type, count]
                    properties:
                      type: { type: string, enum: [quorum] }
                      count: { type: integer, minimum: 1 }
                  - type: object
                    required: [type, percent]
                    properties:
                      type: { type: string, enum: [quorum_percent] }
                      percent: { type: number, exclusiveMinimum: 0, maximum: 100 }
                      require_host_until_all_submitted:
                        type: boolean
                        default: false
                        description: >-
                          Require host approval at the configured quorum and
                          advance automatically only when all assignments complete.
                          Hybrid handoff feedback uses completed canonical responses.
              dimension_ownership:
                type: array
                items: { type: string, minLength: 1 }
              pre_survey_config:
                type: array
                items:
                  type: object
                  required: [key, label, type, required]
                  properties:
                    key: { type: string, minLength: 1 }
                    label: { type: string, minLength: 1 }
                    type:
                      type: string
                      enum: [Short field, Email, Options]
                    options:
                      type: array
                      items: { type: string, minLength: 1 }
                    required: { type: boolean }
                    derive_options_from:
                      type: string
                      enum: [previous_step]
        output_artifact:
          type: string
          enum: [wardley, sixhats, cynefin, bmc]
        project_summary_prompt:
          type: string

    PublicSessionListItem:
      type: object
      description: Session object returned by the public discovery endpoint. Extends SessionListItem with a join URL.
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active]
        participant_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        join_url:
          type: string
          format: uri
          description: Direct URL for participants to join the session
      required: [id, topic, goal, status, participant_count, created_at, updated_at, join_url]

    Question:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        position:
          type: integer
      required: [id, text, position]

    Participant:
      type: object
      properties:
        participant_id:
          type: string
          format: uuid
        participant_name:
          type: string
          nullable: true
        active:
          type: boolean
          description: Whether the participant is still in conversation
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required: [participant_id, participant_name, active, messages]

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, role, content, created_at]

    ResponseSubmission:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
      required: [content]

    ResponseCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, session_id, content, created_at]

    UserInfo:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        subscription_status:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        atproto_identity:
          $ref: '#/components/schemas/AtprotoIdentity'
        api_key:
          type: object
          properties:
            name:
              type: string
              nullable: true
            key_prefix:
              type: string
            created_at:
              type: string
              format: date-time
            last_used_at:
              type: string
              format: date-time
              nullable: true
      required: [id, email, subscription_status, api_key, atproto_identity]

    AtprotoIdentity:
      type: object
      description: Private verified identity for this account, also returned by MCP get_me. Linking and disconnecting require interactive web Settings; this does not grant community access or publish attribution.
      required: [status, did, verified_at, settings_url, linking]
      properties:
        status:
          type: string
          enum: [connected, not_connected, unavailable]
        did:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        settings_url:
          type: string
          enum: ['/settings#atproto']
        linking:
          type: string
          enum: [interactive_web_only]

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [total, limit, offset]

    CreateSessionRequest:
      type: object
      description: Request body for creating a new session.
      properties:
        topic:
          type: string
          description: Session topic / title
        goal:
          type: string
          description: What the session aims to achieve
        context:
          type: string
          description: Background context for participants (e.g. SESSION.md from a prior session)
        critical:
          type: string
          description: Critical question or constraint
        prompt:
          type: string
          description: |
            Custom facilitation prompt. If omitted, a prompt is auto-generated server-side
            from the topic, goal, context, and critical fields. Falls back to a basic
            facilitation prompt if generation fails.
        template_id:
          type: string
          description: ID of a template to use
        project_id:
          type: string
          description: |
            Attach the new session to a project (workspace) at create time.
            Requires editor access to the project.
        roster:
          type: array
          description: |
            HAR-1582 - participants for a chain template's first step. Only
            meaningful when template_id resolves to a chain template; ignored
            otherwise.

            Four of the live chain templates declare roles and an assignment
            strategy (Delphi panel, Governance Meeting, Many-to-Many Readiness,
            Example Mapping) and cannot bootstrap without a roster; for those,
            omitting it returns chain.status "roster_incomplete" on an otherwise
            successful create. The other seven declare no roles and start with
            an empty roster.
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              displayName:
                type: string
              auth0Sub:
                type: string
              rolesByStep:
                type: object
                additionalProperties:
                  type: string
                description: |
                  Chain step id to the role slug this participant holds. Read
                  only for steps whose assignment_strategy is "explicit".
        questions:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
            required: [text]
          description: Pre-session questions shown to participants before facilitation begins
        cross_pollination:
          type: boolean
          default: false
          description: Enable cross-pollination of ideas between participant threads
        widgets_enabled:
          type: boolean
          default: false
          description: |
            Enable AI-emitted Polls and ratings widgets (SingleSelect,
            MultiSelect, RatingScale, RankingList) during the session. When
            true, the facilitator may call widget tools mid-conversation to
            present interactive inputs instead of plain text questions.
        results_visibility:
          type: string
          enum: [public, participants, host]
          default: host
          description: |
            Who can see aggregated session results.
            - `host` (default) — only the session owner can see results.
            - `participants` — anyone who completed the session can see what
              others said (drives the end-of-chat "See what others said" link).
            - `public` — anyone with the session URL can see results without
              participating.
            MCP / harmonica-chat callers typically pass `participants` since
            programmatic and Telegram-distributed sessions usually want
            distributed visibility.
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/DistributionTarget'
          description: Distribution channels for the session (e.g. Telegram groups)
      required: [topic, goal]

    DistributionTarget:
      type: object
      description: A distribution channel where the session should be announced.
      properties:
        channel:
          type: string
          enum: [telegram, community-admin, slack, discord, buzz]
          description: >-
            Distribution channel. The enum is the RESERVED vocabulary; only a subset has a
            live dispatcher behind it. A reserved channel without one is rejected at write
            time (422 validation_error) rather than stored and silently ignored, so this
            field never accepts something the platform will not act on. Live today:
            `telegram`. The others are reserved so integrators can see the namespace.
            Note `community-admin` is reserved but bound at the PROJECT level via community
            binding, not per session through this field.
        group_id:
          type: string
          description: Channel-specific group identifier (e.g. Telegram chat ID)
      required: [channel, group_id]

    ChatRequest:
      type: object
      description: Send a message in a conversational facilitation session.
      properties:
        content:
          type: string
          description: The participant's message
        participant_id:
          type: string
          description: Unique identifier for the participant (e.g. Telegram user ID)
        participant_name:
          type: string
          description: Display name of the participant
      required: [content, participant_id, participant_name]

    ChatQuestionsRequest:
      type: object
      description: Submit pre-session question answers to start facilitation.
      properties:
        participant_id:
          type: string
          description: Unique identifier for the participant
        participant_name:
          type: string
          description: Display name of the participant
        answers:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: string
              answer:
                type: string
            required: [question_id, answer]
      required: [participant_id, participant_name, answers]

    ChatResponse:
      type: object
      description: Facilitator response to a chat message.
      properties:
        message:
          type: object
          properties:
            role:
              type: string
              enum: [assistant]
            content:
              type: string
              description: The facilitator's response
            is_final:
              type: boolean
              description: Whether the facilitator considers this conversation complete
            widget_spec:
              type: object
              description: >-
                Structured widget the facilitator emitted on this turn. Present
                only when the session has widgets_enabled and the model chose to
                render a poll or rating or ranking instead of plain prose. The
                facilitator also mirrors the widget into the text of content, so
                a client that cannot render this spec should expect wording such
                as "drag to rank these" with no control attached.
              properties:
                root:
                  type: object
                  description: The widget to render.
                  properties:
                    type:
                      type: string
                      enum: [SingleSelect, MultiSelect, RatingScale, RankingList]
                    props:
                      type: object
                      description: Per-type rendering options such as labels or bounds.
                    children:
                      type: array
                      items:
                        type: string
                  required: [type, props, children]
              required: [root]
          required: [role, content, is_final]
        thread_id:
          type: string
          description: The participant's thread ID in this session
      required: [message, thread_id]

    TelegramGroup:
      type: object
      description: A Telegram group registered to the user's account.
      properties:
        group_id:
          type: string
          description: Telegram chat ID
        group_name:
          type: string
          nullable: true
          description: Telegram group title
        topic_id:
          type: integer
          nullable: true
          description: Forum topic ID for bot announcements
        created_at:
          type: string
          format: date-time
      required: [group_id, created_at]

    RegisterTelegramGroupRequest:
      type: object
      properties:
        group_id:
          type: string
          description: Telegram chat ID
        group_name:
          type: string
          description: Telegram group title
        topic_id:
          type: integer
          description: Forum topic ID (if group has topics enabled)
      required: [group_id]

    SessionCreated:
      type: object
      description: Session object returned after creation. Extends SessionListItem with a join URL.
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active]
        participant_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        join_url:
          type: string
          format: uri
          description: Direct URL for participants to join the session
        chain:
          type: object
          description: >-
            Outcome of chain bootstrap. Present only when template_id named a
            chain template. Any status other than started or resumed means the
            session was created and is real but is NOT running as a chain, so
            treat this field as the authoritative signal rather than assuming
            a 201 implies a running chain. The most common degraded status is
            roster_incomplete, because several chain templates declare roles
            and cannot start without a roster.
          properties:
            status:
              type: string
              enum:
                - started
                - resumed
                - noop
                - unsupported
                - roster_incomplete
                - step_cap_exceeded
                - project_cap_exceeded
                - project_creation_failed
                - bootstrap_failed
            chainInstanceId:
              type: string
              description: Present when status is started or resumed.
            stepId:
              type: string
              description: The first step of the chain. Present when status is started or resumed.
            message:
              type: string
              description: Why the chain did not start. Present on the degraded statuses.
            reason:
              type: string
              description: Present when status is noop.
          required: [status]
      required: [id, topic, goal, status, participant_count, created_at, updated_at, join_url]

    ContextSource:
      type: object
      description: A context source attached to a session (file, session snapshot, or MCP server).
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [file, session, mcp, url]
        title:
          type: string
        position:
          type: integer
          description: Sort order within the session (lower = injected earlier in prompt).
        content_mode:
          type: string
          enum: [verbatim, chunked]
          nullable: true
          description: |
            `verbatim` — full text stored in the row.
            `chunked` — text split and embedded in `session_embeddings` for vector retrieval.
            `null` for MCP sources (no stored content).
        source_ref:
          type: string
          format: uuid
          nullable: true
          description: For `session` sources — the ID of the referenced session.
        mcp_config:
          type: object
          nullable: true
          description: For `mcp` sources — connection config and cached tool list.
          properties:
            url:
              type: string
              format: uri
            bearer:
              type: string
              nullable: true
            tool_allowlist:
              type: array
              nullable: true
              items:
                type: string
            cached_tools:
              type: array
              items:
                type: string
            consecutive_fails:
              type: integer
            status:
              type: string
              enum: [healthy, unhealthy]
        token_estimate:
          type: integer
          nullable: true
          description: Estimated token count for verbatim content.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, session_id, source_type, title, position, created_at, updated_at]

    ProjectContextSourceManagementRow:
      type: object
      description: Compact project-management row. Stored source content and MCP bearer values are never included.
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid, nullable: true }
        session_id: { type: string, format: uuid, nullable: true }
        source_type:
          type: string
          enum: [file, session, mcp, url, repo]
        source_class:
          type: string
          enum: [meeting, static, repository, mcp]
        title: { type: string }
        position: { type: integer }
        content_mode:
          type: string
          enum: [verbatim, chunked]
          nullable: true
        file_meta: { type: object, nullable: true, additionalProperties: true }
        source_ref: { type: string, nullable: true }
        mcp_config:
          type: object
          nullable: true
          description: Safe MCP metadata. The write-only bearer field is omitted.
          additionalProperties: true
        token_estimate: { type: integer, nullable: true }
        extracted_knowledge: { type: object, nullable: true, additionalProperties: true }
        knowledge_curation: { type: object, nullable: true, additionalProperties: true }
        repo_config: { type: object, nullable: true, additionalProperties: true }
        pending_statement_count: { type: integer, minimum: 0 }
        session_topic:
          type: string
          nullable: true
          description: Present on inherited session-owned rows.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required:
        - id
        - workspace_id
        - session_id
        - source_type
        - source_class
        - title
        - position
        - content_mode
        - file_meta
        - source_ref
        - mcp_config
        - token_estimate
        - extracted_knowledge
        - knowledge_curation
        - repo_config
        - pending_statement_count
        - created_at
        - updated_at

    ProjectSourceQuota:
      type: object
      properties:
        source_class:
          type: string
          enum: [meeting, static, repository, mcp]
        count: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
      required: [source_class, count, limit]

    ProjectSourcePagination:
      type: object
      properties:
        scope:
          type: string
          enum: [project, inherited]
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: string, nullable: true }
      required: [scope, total, limit, next_cursor]

    ProjectContextSourceListResponse:
      type: object
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/ProjectContextSourceManagementRow' }
        inheritedSources:
          type: array
          items: { $ref: '#/components/schemas/ProjectContextSourceManagementRow' }
        pagination:
          $ref: '#/components/schemas/ProjectSourcePagination'
        quotas:
          type: array
          items: { $ref: '#/components/schemas/ProjectSourceQuota' }
      required: [sources, inheritedSources, pagination, quotas]

    LegacyProjectContextSourceListResponse:
      type: object
      description: Legacy unpaginated response retained for callers that omit all management query parameters.
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/ContextSource' }
        inheritedSources:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ContextSource'
              - type: object
                properties:
                  session_topic: { type: string, nullable: true }
      required: [sources, inheritedSources]

    MeetingAttachmentBatchItem:
      type: object
      properties:
        meeting_id:
          type: string
          format: uuid
        title:
          type: string
          description: Optional project-source title. Blank values fall back to the meeting title.
      required: [meeting_id]

    MeetingAttachmentSource:
      type: object
      description: Safe attachment row. Stored source content, file metadata, and MCP configuration are omitted.
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid, nullable: true }
        source_type: { type: string, enum: [file] }
        title: { type: string }
        content_mode:
          type: string
          enum: [verbatim, chunked]
          nullable: true
        source_ref: { type: string, nullable: true }
        token_estimate: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, workspace_id, source_type, title, content_mode, source_ref, token_estimate, created_at, updated_at]

    MeetingAttachmentBatchResult:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based position in the requested meetings array.
        meeting_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - created
            - existing
            - processing
            - meeting_not_found
            - transcript_not_found
            - transcript_not_ready
            - restricted
            - quota_exceeded
            - invalid
            - failed
        source:
          $ref: '#/components/schemas/MeetingAttachmentSource'
        transcript_status:
          type: string
          description: Present when status is transcript_not_ready.
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [index, meeting_id, status]

    MeetingAttachmentBatchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/MeetingAttachmentBatchResult' }
        summary:
          type: object
          properties:
            requested: { type: integer, minimum: 1, maximum: 50 }
            succeeded: { type: integer, minimum: 0, maximum: 50 }
            failed: { type: integer, minimum: 0, maximum: 50 }
            created: { type: integer, minimum: 0, maximum: 50 }
            existing: { type: integer, minimum: 0, maximum: 50 }
            processing: { type: integer, minimum: 0, maximum: 50 }
          required: [requested, succeeded, failed, created, existing, processing]
      required: [results, summary]

    SessionKnowledge:
      type: object
      description: |
        Structured, typed knowledge synthesised from a session — decisions,
        action items, tensions, and atomic claims — each carrying message-ID
        provenance. Generated after the session summary. Pro feature.
      properties:
        decisions:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              summary:
                type: string
              evidence:
                type: array
                description: Source message IDs backing this decision.
                items:
                  type: string
              phase:
                type: string
            required: [label, summary, evidence]
        actions:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              owner:
                type: string
              due:
                type: string
              evidence:
                type: array
                items:
                  type: string
            required: [description, evidence]
        tensions:
          type: array
          items:
            type: object
            properties:
              summary:
                type: string
              sides:
                type: array
                minItems: 2
                items:
                  type: string
              evidence:
                type: array
                items:
                  type: string
              basis:
                type: [string, 'null']
                enum: [values, knowledge, null]
                description: Knowledge if a further fact could settle the disagreement; values otherwise.
            required: [summary, sides, evidence]
        claims:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                enum: [decision, tension, action, open-question, observation, quote, minority-view]
              text:
                type: string
              evidence:
                type: array
                items:
                  type: string
              phase:
                type: string
              strength:
                type: number
                minimum: 0
                maximum: 1
            required: [category, text, evidence]
        gaps:
          type: array
          description: Areas the session left unresolved (optional).
          items:
            type: string
        metadata:
          type: object
          properties:
            generatedAt:
              type: integer
              description: Unix epoch timestamp when the knowledge was generated.
            model:
              type: string
            version:
              type: integer
              enum: [1]
          required: [generatedAt, model, version]
      required: [decisions, actions, tensions, claims, metadata]

    CreateProjectRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          description: Project (workspace) title.
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional project description (markdown).
        project_type:
          type: string
          enum: [broad-listening, team-os]
          description: 'Project type, set at creation only and immutable afterwards. Omit for a standard project. A type governs behaviour (visibility, participation, which artifacts and public surfaces the project gets), not just labelling, so there is no conversion path between types.'
      required: [title]

    UpdateProjectRequest:
      type: object
      description: All fields optional; at least one must be provided.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: New project title.
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: New project description (markdown).

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: Project lifecycle status (active, draft, deleted).
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, title, status, is_public, created_at]

    SensemakingSettingsRequest:
      type: object
      description: >-
        Author + publish a project as a public sensemaking topic. All fields are
        optional; send `enabled: true` (with a `slug` in this request or already
        saved) to publish.
      properties:
        slug:
          type: string
          nullable: true
          description: URL handle for /t/{slug}. Lowercase words separated by single hyphens.
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 500
        intro:
          type: string
          nullable: true
          maxLength: 2000
          description: Host-authored background paragraph.
        faq:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: object
            properties:
              q: { type: string }
              a: { type: string }
            required: [q, a]
        theme:
          type: string
          nullable: true
          description: Topic category powering the /explore hub filter.
        enabled:
          type: boolean
          description: Publish (true) or unpublish (false) the public topic page.
        reasoningLensEnabled:
          type: boolean
          description: Opt the embedding-based Reasoning lens in.
        knowledgeStatementsEnabled:
          type: boolean
          description: Source opinion-map statements from project knowledge.

        publicArtifacts:
          type: array
          nullable: true
          uniqueItems: true
          description: >-
            Explicit native artifact instances on the broad-listening page.
            Omit to preserve; null or [] clears. No implicit selection.
            Every selected instance must belong to this Project and have public
            source sessions. Selection never widens source access.
            Available after the topic-artifact selection rollout.
          items:
            type: object
            additionalProperties: false
            required: [kind, ref]
            properties:
              kind:
                type: string
                enum: [wardley, sixhats, cynefin, swot]
              ref:
                type: string
                minLength: 1
                pattern: '\S'
                description: Exact chain-instance ID, or session ID for SWOT.

    SensemakingTopic:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        public_artifacts:
          $ref: '#/components/schemas/SensemakingSettingsRequest/properties/publicArtifacts'
        enabled:
          type: boolean
        slug:
          type: string
          nullable: true
        theme:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true
        faq:
          type: array
          nullable: true
          items:
            type: object
            properties:
              q: { type: string }
              a: { type: string }
        group_count:
          type: integer
        statement_count:
          type: integer
        voter_count:
          type: integer
        computed_at:
          type: string
          format: date-time
          nullable: true
        gallery_status:
          type: string
        reasoning_lens_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        [
          workspace_id,
          enabled,
          group_count,
          statement_count,
          voter_count,
          gallery_status,
          reasoning_lens_enabled,
          created_at,
        ]

    Meeting:
      type: object
      description: Calendar meeting metadata. Direct Project-derived reads redact meeting_url and raw error_message to null.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        meeting_url: { type: string, format: uri, nullable: true }
        meeting_provider:
          type: string
          enum: [google_meet, zoom, microsoft_teams]
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        timezone: { type: string, nullable: true }
        status:
          type: string
          enum: [scheduled, joining, in_call, recording, transcribing, ready, failed, cancelled]
        error_code: { type: string, nullable: true }
        error_message:
          type: string
          nullable: true
          description: Raw meeting failure detail for the owner; null for Project-derived readers.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, title, meeting_url, meeting_provider, starts_at, ends_at, timezone, status, error_code, error_message, created_at, updated_at]
    TranscriptSourceProvenance:
      type: object
      properties:
        kind:
          type: string
          enum: [harmonica_capture, provider_import, manual_import]
        provider:
          type: string
          description: Source provider name. Provider names are extensible rather than a closed enum.
      required: [kind, provider]
    TranscriptProcessingProvenance:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        normalization_version: { type: string }
        attempt_status:
          type: string
          enum: [pending, processing, succeeded, failed]
        failure_stage:
          type: string
          enum: [capture, transcription, normalization, persistence, unknown]
          nullable: true
        failure_disposition:
          type: string
          enum: [retryable, terminal]
          nullable: true
        error_code: { type: string, nullable: true }
        error_message:
          type: string
          nullable: true
          description: Raw detail for the owner; Project-derived readers receive only a safe generic message.
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
      required: [provider, model, normalization_version, attempt_status, failure_stage, failure_disposition, error_code, error_message, started_at, completed_at]
    MeetingTranscriptMetadata:
      type: object
      properties:
        id: { type: string, format: uuid }
        meeting_id: { type: string, format: uuid }
        status:
          type: string
          enum: [processing, ready, failed]
        availability:
          type: string
          enum: [pending, ready, retryable_failure, terminal_failure, restricted]
        language: { type: string, nullable: true }
        revision:
          type: integer
          minimum: 1
          nullable: true
          description: Advances only when canonical transcript content changes.
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          nullable: true
        restriction_revision:
          type: string
          pattern: '^\d+$'
          description: Latest restriction event sequence, or "0". Cache checks compare this with content_hash.
        completed_at: { type: string, format: date-time, nullable: true }
        source: { $ref: '#/components/schemas/TranscriptSourceProvenance' }
        processing: { $ref: '#/components/schemas/TranscriptProcessingProvenance' }
      required: [id, meeting_id, status, availability, language, revision, content_hash, restriction_revision, completed_at, source, processing]
    MeetingListItem:
      allOf:
        - $ref: '#/components/schemas/Meeting'
        - type: object
          properties:
            transcript_status:
              type: string
              enum: [processing, ready, failed]
              nullable: true
            transcript_language: { type: string, nullable: true }
            has_transcript: { type: boolean }
            empty_transcript: { type: boolean }
            utterance_count: { type: integer, minimum: 0 }
            speaker_count: { type: integer, minimum: 0 }
            actual_duration_ms: { type: integer, minimum: 0, nullable: true }
            effective_restriction_scopes:
              type: array
              items:
                type: string
                enum: [synthesis, project_attachment, external_export, sharing, all_downstream_processing]
            project_attachment_count: { type: integer, minimum: 0 }
            transcript:
              allOf:
                - $ref: '#/components/schemas/MeetingTranscriptMetadata'
              nullable: true
          required: [transcript_status, transcript_language, has_transcript, empty_transcript, utterance_count, speaker_count, actual_duration_ms, effective_restriction_scopes, project_attachment_count, transcript]
    MeetingListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MeetingListItem' }
        pagination:
          type: object
          properties:
            total: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            offset: { type: integer, minimum: 0 }
            next_cursor: { type: string, nullable: true }
          required: [total, limit, offset, next_cursor]
      required: [data, pagination]
    MeetingDetail:
      allOf:
        - $ref: '#/components/schemas/Meeting'
        - type: object
          properties:
            access_basis: { type: string, enum: [owner, project] }
            transcript:
              allOf:
                - $ref: '#/components/schemas/MeetingTranscriptMetadata'
              nullable: true
          required: [access_basis, transcript]
    TranscriptSegment:
      type: object
      description: A bounded part of one source speaker turn. Adjacent segments with the same sequence may be joined.
      properties:
        sequence: { type: integer, minimum: 0 }
        speaker_id: { type: string, nullable: true }
        speaker_name: { type: string, nullable: true }
        speaker_email:
          type: string
          nullable: true
          description: Present only when an owner explicitly requests it in turns format. Provider labels are unverified identity claims.
        start_ms: { type: integer, minimum: 0, nullable: true }
        end_ms: { type: integer, minimum: 0, nullable: true }
        text: { type: string }
        language: { type: string, nullable: true }
        continues_before: { type: boolean }
        continues_after: { type: boolean }
        text_offset: { type: integer, minimum: 0 }
      required: [sequence, speaker_id, speaker_name, start_ms, end_ms, text, language, continues_before, continues_after, text_offset]
    MeetingTranscriptPagination:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        max_chars: { type: integer, minimum: 1000, maximum: 50000 }
        returned_chars: { type: integer, minimum: 0, maximum: 50000 }
        next_cursor: { type: string, nullable: true }
        complete: { type: boolean }
      required: [limit, max_chars, returned_chars, next_cursor, complete]
    MeetingTranscriptPage:
      type: object
      description: Exactly one bounded transcript page. The server never follows next_cursor automatically.
      properties:
        transcript: { $ref: '#/components/schemas/MeetingTranscriptMetadata' }
        access_basis: { type: string, enum: [owner, project] }
        segments:
          type: array
          items: { $ref: '#/components/schemas/TranscriptSegment' }
        text:
          type: string
          description: Plain-text rendering returned for format=text. Speaker email is never included.
        pagination: { $ref: '#/components/schemas/MeetingTranscriptPagination' }
      required: [transcript, access_basis, pagination]
      oneOf:
        - required: [segments]
        - required: [text]
    CompleteTranscriptTurn:
      type: object
      properties:
        sequence: { type: integer, minimum: 0 }
        speaker_id: { type: string, nullable: true }
        speaker_name: { type: string, nullable: true }
        speaker_email: { type: string, nullable: true }
        start_ms: { type: integer, minimum: 0, nullable: true }
        end_ms: { type: integer, minimum: 0, nullable: true }
        text: { type: string }
        language: { type: string, nullable: true }
      required: [sequence, speaker_id, speaker_name, speaker_email, start_ms, end_ms, text, language]
    MeetingTranscriptExport:
      type: object
      properties:
        exported_at: { type: string, format: date-time }
        meeting: { $ref: '#/components/schemas/Meeting' }
        transcript:
          allOf:
            - $ref: '#/components/schemas/MeetingTranscriptMetadata'
            - type: object
              properties:
                utterances:
                  type: array
                  items: { $ref: '#/components/schemas/CompleteTranscriptTurn' }
              required: [utterances]
      required: [exported_at, meeting, transcript]
    MeetingRestrictionEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        sequence:
          type: string
          description: Monotonic append-only event sequence.
        meeting_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [restriction_set, candidate_flagged, candidate_confirmed, candidate_dismissed]
        scopes:
          type: array
          items:
            type: string
            enum: [synthesis, project_attachment, external_export, sharing, all_downstream_processing]
        reason: { type: string }
        source:
          type: string
          enum: [owner, policy, transcript_signal]
        actor_id: { type: string, nullable: true }
        review_of_event_id: { type: string, format: uuid, nullable: true }
        dedupe_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, sequence, meeting_id, event_type, scopes, reason, source, created_at]
    MeetingRestrictionState:
      type: object
      properties:
        authoritative_scopes:
          type: array
          items: { type: string }
        candidate_scopes:
          type: array
          items: { type: string }
        effective_scopes:
          type: array
          items: { type: string }
        pending_candidates:
          type: array
          items: { $ref: '#/components/schemas/MeetingRestrictionEvent' }
        history:
          type: array
          items: { $ref: '#/components/schemas/MeetingRestrictionEvent' }
      required: [authoritative_scopes, candidate_scopes, effective_scopes, pending_candidates, history]
    SetMeetingRestrictionsRequest:
      type: object
      properties:
        action: { type: string, const: set }
        scopes:
          type: array
          description: Complete authoritative scope snapshot. Pass an empty array to lift restrictions.
          items:
            type: string
            enum: [synthesis, project_attachment, external_export, sharing, all_downstream_processing]
        reason: { type: string, minLength: 1, maxLength: 1000 }
      required: [action, scopes, reason]
    ReviewMeetingRestrictionCandidateRequest:
      type: object
      properties:
        action: { type: string, const: review_candidate }
        candidate_event_id: { type: string, format: uuid }
        decision: { type: string, enum: [confirm, dismiss] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
      required: [action, candidate_event_id, decision, reason]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation_error
                - rate_limited
                - payment_required
                - transcript_revision_changed
                - needs_rebuild
                - source_changed
                - internal_error
                - unprocessable
            message:
              type: string
          required: [code, message]
      required: [error]

  parameters:
    chainInstanceId:
      name: instanceId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Existing BMC chain instance ID; each chain has its own Canvas.
    sessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session ID

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Invalid or missing API key
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: You don't have access to this session
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Session not found
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Rate limit exceeded. Try again in 30 seconds.

paths:
  /chains/{instanceId}/bmc:
    get:
      operationId: getBusinessModelCanvas
      summary: Read a chain's Business Model Canvas
      tags: [Chains]
      security:
        - apiKey: []
        - chainParticipantToken: []
      description: |
        Reads only; never generates a Canvas. All responses use private, no-store.
        Authenticated accounts (API key or browser session) need workspace viewer
        access and access to the results audience of every source session. A
        host-only source requires owner/admin access to that source; a workspace
        editor role alone does not override the source's audience.

        Alternatively, pass the signed invitation identity in
        x-chain-participant-token and select stepIndex or closing=true. The server
        rechecks membership in this chain, withdrawal, participant sharing and the
        requested round. Review rounds need an eligible assignment, cannot be in
        the future, and return their immutable bound revision. Closing reads need
        a completed chain and an approved closing revision. A valid token plus a
        round/closing selector requests the participant projection even when the
        caller is also signed in. It grants no workspace role, candidate history,
        original-contribution access or arbitrary revision selection.

        Source changes may withhold state on management reads while preserving
        recovery controls; stale participant snapshots fail closed. Review and
        evidence status remain distinct. A filled Canvas is not proof of agreement,
        market demand or viability. Rendered/exported adaptations retain visible
        Strategyzer.com credit and the original/adaptation license notices.
      parameters:
        - $ref: '#/components/parameters/chainInstanceId'
        - name: stepIndex
          in: query
          required: false
          description: Zero-based review step for a participant read; must be at least 1 and no later than the current step. Ignored for an authorized management projection.
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
        - name: closing
          in: query
          required: false
          description: Literal true selects the approved closing revision for a participant; takes precedence over stepIndex. Ignored for a management projection.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authorized management state or one participant-bound revision.
          headers:
            Cache-Control: { schema: { type: string }, description: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcReadResponse' }
        '400':
          description: Invalid round index.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '401':
          description: No authenticated account or valid signed participant identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '403':
          description: Workspace/source access denied or participant sharing disabled (bmc_sharing_disabled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '404':
          description: Chain absent or not BMC, participant not admitted, or requested round not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '409':
          description: Bound snapshot missing (bmc_snapshot_missing) or its source changed (bmc_source_changed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: The Canvas could not be loaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
    patch:
      operationId: updateBusinessModelCanvas
      summary: Correct, review or control sharing of a Canvas
      tags: [Chains]
      description: |
        Requires authenticated workspace editor access plus each source session's
        results audience. Participant tokens do not authorize writes. Changes use
        expectedRevision under the chain lock; stale revisions return bmc_changed.
        Unknown or duplicate entries, conflicting removals and invalid links are
        rejected. Additions use an existing model ID and a server-generated entry ID.
        Edits/removals are protected against later extraction; new conflicting model
        output remains a proposal. No model call is made by this operation.

        approve=true reviews the resulting revision for the next dependent round.
        closing=true also requires approve=true, a completed chain and a current
        final extraction. Neither action supplies group agreement or validates
        estimates. Sharing-only changes can be made before a Canvas exists or when
        source content is withheld, using management.expectedRevision and edits=[].
        Source-dependent edits/approvals require current sources. Turning sharing
        off denies later participant reads, including the closing Canvas; it does
        not grant new transcript access. Responses use private, no-store.
      parameters:
        - $ref: '#/components/parameters/chainInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BmcEditRequest' }
            example:
              expectedRevision: 2
              edits:
                - entryId: cost-estimate
                  evidenceKind: estimate
                  reviewStatus: confirmed
                  dispute: Another contributor estimates a higher cost; unresolved.
              approve: true
      responses:
        '200':
          description: Updated management state and preparation/review eligibility.
          headers:
            Cache-Control: { schema: { type: string }, description: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcReadResponse' }
        '400':
          description: Invalid update shape or entry edit (validation_error or bmc_invalid_edit).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Workspace editor or source-results audience access is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '404':
          description: Chain absent or not a BMC chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '409':
          description: Canvas revision/source changed or closing extraction/review is not ready. Refresh before deciding on another update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: The Canvas could not be updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }

  /chains/{instanceId}/extract-bmc:
    post:
      operationId: prepareBusinessModelCanvas
      summary: Explicitly prepare or retry a Canvas round
      tags: [Chains]
      description: |
        Requires an authenticated workspace editor and each source session's results
        audience. Send retry=true to explicitly request preparation, including the
        first manual request; otherwise returns explicit_retry_required. Signed
        participant tokens do not authorize preparation. The platform also uses a
        server-only internal dispatcher; its credential is not a user API credential.

        Uses the selected round's current eligible group summary and server-captured
        source identity. A claimed request makes a model call billed through that
        source session's owner configuration; the editor need not be its payer.
        This can incur cost. A current ready result or active pending claim returns
        its status without another model call. Failed preparation requires an
        explicit retry; an expired pending claim may be retried after six minutes.
        No automatic retry is performed. A source change or newer accepted round
        can reject the request. Summary readiness is not Canvas readiness or human
        approval, and preparation never advances the chain.

        Preparing a replacement after a source change updates the candidate; it
        cannot replace an immutable snapshot already bound to an affected review
        round. The host must restart that affected continuation in a fresh chain.
        Access is rechecked before merging an editor's result. Responses use
        private, no-store and never serialize provider prompt/error details.
      parameters:
        - $ref: '#/components/parameters/chainInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BmcPrepareRequest' }
            example: { stepIndex: 0, retry: true }
      responses:
        '200':
          description: Existing claim status or completed preparation; revision is present only after a claimed extraction finishes.
          headers:
            Cache-Control: { schema: { type: string }, description: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcPrepareResponse' }
        '400':
          description: Invalid body or missing explicit retry=true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Workspace editor/source-results access denied, or a supplied internal credential is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '404':
          description: Chain absent or not a BMC chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '409':
          description: Current source summary is unavailable or changed, or a newer round already supplied the Canvas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: Preparation could not begin due to an internal error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }
        '502':
          description: Claimed model preparation failed (bmc_extraction_failed). An explicit new retry is required and may incur cost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BmcError' }

  /sessions/{id}/stakeholders:
    get:
      summary: Read the stakeholder engagement map
      operationId: getStakeholderMap
      tags: [Sessions]
      security:
        - {}
        - apiKey: []
      description: |
        Available only for standalone Stakeholder Analysis sessions. Reading never
        generates a map. A never-generated map returns an empty artifact.
        Public sessions permit anonymous reads. Host-only sessions require owner
        or admin access; participant sessions also permit editors or a finished
        non-preview participant's thread_id. Community sessions additionally
        permit a verified signed-in member of the session's bound community;
        API-key account emails are not verified community identities.
        Private evidence quotes and review metadata require editor access and
        admission to the results audience. Map responses use private, no-store.
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - name: thread_id
          in: query
          required: false
          description: Finished non-preview participant proof scoped to this session.
          schema:
            type: string
      responses:
        '200':
          description: Safe map, with additional review fields only for authorized editors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapResponse'
        '403':
          description: Audience denied; community denial uses community_gated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '404':
          description: Session absent or not a supported standalone Stakeholder Analysis session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '500':
          description: The map could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
    post:
      summary: Regenerate the stakeholder engagement map
      operationId: regenerateStakeholderMap
      tags: [Sessions]
      description: |
        Requires editor access or above and admission to the results audience
        (owner or admin for host-only sessions). Send an empty body or {}.
        Extracts reported accounts from included non-preview authored answers,
        preserving host-corrected fields. A real summary is required. No answers
        means no model call and no map write. A source change during generation
        returns 409 without replacing the saved state. Existing sessions are not
        backfilled; a future summary or this explicit action generates their map.
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Regenerated map with authorized editor review fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapResponse'
        '400':
          description: Invalid body, missing real summary or no included participant answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Editor role or results-audience access is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '404':
          description: Session absent or not a supported standalone Stakeholder Analysis session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '409':
          description: Map source or state changed; reload before regenerating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'
        '500':
          description: The map could not be generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderMapError'

  /sessions/{id}/chain-state:
    get:
      operationId: getChainState
      summary: Inspect host-authorized chain state and blockers
      description: |
        Inspect a chain using any of its session IDs. Requires owner/admin access
        to the origin (step-zero) session; ownership of a later session or project
        editor membership alone is insufficient. Returns stable chain, step and
        session IDs without prompts, summaries, roster emails or participant text.
        A read makes no state changes. can_advance is advisory; continue rechecks
        eligibility under the existing runtime's chain lock.
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chain state and actionable blockers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainControlState'
        '401': { description: Authentication required }
        '403':
          description: Owner or admin access to the origin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainControlError'
        '404': { description: Session is not part of a chain or chain not found }
        '500': { description: Internal error }
  /sessions/{id}/continue-chain:
    post:
      operationId: continueChain
      summary: Request guarded host chain progression
      description: |
        Requires owner/admin access to the origin session. Platform session
        metadata audit keys cannot advance chains, even for a session they own.
        Pass current_step_id from chain-state as expected_step_id. No force,
        trigger override, credit-retry query option or completion bypass exists
        in this API-key contract. Existing empty-body browser UI/internal calls
        retain their legacy response contract and are not described here.

        Completion/quorum/timer and role readiness use the normal runtime rules.
        Empty current steps return no_participant_answers when the successor
        needs a summary. On newly launched roster chains, can_start_summary
        signals that Continue can accept the round and start preparing sealed
        feedback. A 202 response means the chain is preparing feedback. Poll
        chain-state or replay the same expected step to retrieve the completed
        receipt. On other runs, generate missing summaries separately before
        retrying the same expected step.
        Rejected preconditions make no chain writes. A runtime handoff failure
        retains the normal runtime pause behavior and returns advance_failed.

        A committed transition stores actor/transport evidence atomically. A retry
        of that expected step returns its original receipt with replayed=true,
        without creating sessions/assignments or redispatching notifications.
        The normal runtime may catch up additional already-complete automatic
        steps; inspect chain-state again for the latest frontier. Normal progression
        may reserve credits and email assigned roster participants.
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_step_id]
              properties:
                expected_step_id:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Original or replayed committed transition receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainHostAdvanceReceipt'
        '202':
          description: Sealed feedback is being prepared
          content:
            application/json:
              schema:
                type: object
                required: [action, chain_id, from_step_id]
                properties:
                  action: { type: string, enum: [waiting_for_summary] }
                  chain_id: { type: string }
                  from_step_id: { type: string }
        '400': { description: Invalid request body or unsupported query override }
        '401': { description: Authentication required }
        '403': { description: Origin owner/admin required or metadata audit key refused }
        '404': { description: Session is not part of a chain or chain not found }
        '409':
          description: Stale step or unmet prerequisites or failed runtime handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainControlError'
        '500': { description: Internal error }
  /me:
    get:
      summary: Get current user
      description: Returns user info, API key metadata and the private verified ATProto association for the authenticated user. Association storage failures return status unavailable rather than claiming no identity is connected.
      operationId: getMe
      tags: [Account]
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /templates:
    get:
      summary: List templates
      description: |
        Returns templates visible to the authenticated user: public global
        templates, templates they own, and (when `workspace_id` is provided and
        they have access) that workspace's templates. Archived templates are excluded.
      operationId: listTemplates
      tags: [Templates]
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
          description: Also include templates scoped to this workspace (caller must have access).
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create template
      description: |
        Creates a template owned by the authenticated user. Private and
        user-scoped by default; provide `workspace_id` to create a
        workspace-scoped template (caller must be a workspace admin).

        Pass `template_type: chain` with a `chain_config` to install a chain
        method-spec (HAR-1098). Chain creation is subject to the same per-plan
        step cap as launching a chain (Free is capped; paid is unlimited).
      operationId: createTemplate
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Validation error (missing required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Must be a workspace admin to create a workspace template, or the
            chain step count exceeds the caller's plan limit (HAR-1098).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /templates/{id}:
    get:
      summary: Get template
      description: Returns a single template the caller can read.
      operationId: getTemplate
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to this template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update template
      description: |
        Updates a template. Caller must be the owner, a workspace admin (for
        workspace-scoped templates), or a global admin.

        Set `template_type: chain` with a `chain_config` to convert a single
        template into a chain, or send `chain_config` to edit an existing
        chain (HAR-1098). Subject to the same per-plan step cap as chain launch.
      operationId: updateTemplate
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: >-
            Validation error, prohibited scope/catalog changes during reinstall,
            or missing/stale reviewed overwrite proof for modified or unverified content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            No permission to edit this template, or the chain step count exceeds
            the caller's plan limit (HAR-1098).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Template changed after the read or was removed. Read and review again; force never bypasses the conditional update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete template
      description: |
        Deletes a template. Caller must be the owner, a workspace admin (for
        workspace-scoped templates), or a global admin.
      operationId: deleteTemplate
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No permission to delete this template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects:
    post:
      summary: Create project
      description: |
        Creates an evergreen project (workspace) owned by the authenticated user.
        Use the returned `id` to publish the project as a public sensemaking topic
        via `PATCH /projects/{id}/sensemaking`, or reuse an existing project id you
        already own.
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Validation error (missing title)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List projects
      description: List the projects (workspaces) the caller can access.
      operationId: listProjects
      tags: [Projects]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required: [data, pagination]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /meetings:
    get:
      summary: List owned meetings
      description: |
        Lists only personal calendar meetings owned by the API-key user. Project
        membership never expands this catalogue. Results include compact transcript
        currentness, processing provenance, safe restriction scopes, and Project
        attachment counts without transcript text. Provider speaker labels remain
        unverified source labels and do not establish identity across recordings.
      operationId: listMeetings
      tags: [Meetings]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, joining, in_call, recording, transcribing, ready, failed, cancelled]
        - name: provider
          in: query
          schema:
            type: string
            enum: [google_meet, zoom, microsoft_teams]
        - name: attachment
          in: query
          description: Filter by whether the meeting is attached to at least one Project.
          schema:
            type: string
            enum: [attached, unattached]
        - name: from
          in: query
          description: Include meetings starting at or after this timestamp.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Include meetings starting before this timestamp.
          schema: { type: string, format: date-time }
        - name: updated_since
          in: query
          description: Include meetings updated at or after this timestamp.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Legacy offset pagination. Cannot be combined with a non-first-page cursor.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: cursor
          in: query
          description: Opaque stable cursor returned by the previous meeting page.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Owner-scoped meeting page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingListResponse' }
        '400':
          description: Invalid filter, date range, or cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /meetings/{id}:
    get:
      summary: Get meeting metadata
      description: |
        Returns full metadata to the meeting owner. A named viewer-or-higher member
        of a non-deleted Project with a current meeting attachment may read redacted
        metadata. Public and platform-global grants do not confer access. Missing and
        unauthorized meetings both return 404. Project-derived responses redact the
        meeting URL and raw errors and require sharing policy to remain allowed.
      operationId: getMeeting
      tags: [Meetings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized meeting detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Meeting not found, not shared, detached, deleted, or restricted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /meetings/{id}/transcript:
    get:
      summary: Get a bounded transcript page
      description: |
        Returns one page bounded by both segment count and Unicode code-point text
        budget. It never auto-follows next_cursor. A cursor is bound to transcript ID
        and revision and may continue within one oversized speaker turn. If canonical
        content changes, an old cursor returns 409 transcript_revision_changed and the
        caller must restart from page one.

        The owner or a named viewer-or-higher member of a non-deleted Project with a
        current attachment may read subject to external_export policy; Project-derived
        access additionally requires sharing policy. Project-derived denial returns the
        same 404 as an unknown meeting. Speaker names, IDs, and emails are unverified
        provider labels and must not be treated as cross-recording identity.
      operationId: getMeetingTranscript
      tags: [Meetings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [turns, text], default: turns }
        - name: limit
          in: query
          description: Maximum number of returned segments.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: max_chars
          in: query
          description: Maximum transcript-text code points returned. JSON framing and fixed metadata are outside this budget.
          schema: { type: integer, minimum: 1000, maximum: 50000, default: 25000 }
        - name: cursor
          in: query
          description: Opaque revision-bound cursor from the previous transcript page.
          schema: { type: string, minLength: 1 }
        - name: include_speaker_email
          in: query
          description: Owner-only and turns-only. Project-derived requests with true fail closed.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: One bounded transcript page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingTranscriptPage' }
        '400':
          description: Invalid format, bounds, boolean, or cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Owner transcript access is restricted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Transcript unavailable or meeting access not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Transcript revision changed; restart from page one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /meetings/{id}/transcript/export:
    get:
      summary: Export the complete current transcript
      description: |
        Owner-only complete JSON export. The export is intentionally unavailable as
        an MCP tool, requires a ready canonical transcript, and checks external_export
        policy immediately before one revision-consistent read. It excludes restriction
        rationale/history and raw provider artifact identifiers.
      operationId: exportMeetingTranscript
      tags: [Meetings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Complete revision-consistent transcript download
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Server-sanitized, bounded attachment filename.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingTranscriptExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Transcript export is restricted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Meeting or ready transcript not found, including all non-owner access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /meetings/{id}/restrictions:
    get:
      summary: Get meeting processing restrictions
      description: Returns effective restriction scopes, pending transcript-derived candidates, and append-only provenance for a meeting owned by the authenticated user.
      operationId: getMeetingRestrictions
      tags: [Meetings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current restriction state and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRestrictionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Update meeting processing restrictions
      description: Sets the complete authoritative restriction scope or confirms/dismisses a pending transcript-derived candidate. Every mutation appends an event; history is never overwritten.
      operationId: updateMeetingRestrictions
      tags: [Meetings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SetMeetingRestrictionsRequest'
                - $ref: '#/components/schemas/ReviewMeetingRestrictionCandidateRequest'
              discriminator:
                propertyName: action
      responses:
        '201':
          description: Updated restriction state and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingRestrictionState' }
        '400': { description: 'Invalid scope, reason, candidate, or decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get project
      description: Get a single project the caller can access, with the ids of its linked sessions.
      operationId: getProject
      tags: [Projects]
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Project'
                  - type: object
                    properties:
                      session_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: IDs of sessions linked to this project.
                    required: [session_ids]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found (or has been soft-deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update project
      description: Rename a project or update its description.
      operationId: updateProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Validation error (no fields provided, or title/description exceeds length limits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires editor access to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found (or has been soft-deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete project
      description: |
        Soft-deletes a project (sets status to `deleted`). Sessions contained in
        the project are left intact — only the project record is marked deleted.
        Requires owner access.
      operationId: deleteProject
      tags: [Projects]
      responses:
        '200':
          description: Project deleted (status is now `deleted`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires owner access to the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found (or has been soft-deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}/sensemaking:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get project sensemaking topic
      description: >-
        Returns the project's sensemaking topic (publish status, slug, theme,
        snapshot counts), or `data: null` if it was never published. Editor access
        required.
      operationId: getProjectSensemaking
      tags: [Projects]
