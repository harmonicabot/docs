      summary: Reopen session
      description: |
        Reopen a completed session so participants can join or continue again.
        Requires editor access or higher. The operation is idempotent and changes
        only the session's active status; existing session data is preserved.
      operationId: reopenSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Reopened session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
