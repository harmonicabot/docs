  /sessions/{id}/responses:
    get:
      summary: Get session responses
      description: |
        Returns all participant responses for a session, grouped by participant.
        Each participant's conversation thread includes both user messages and assistant (facilitator) messages.
      operationId: getSessionResponses
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Participant responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Submit a response
      description: |
        Submit a response to an active session as the authenticated user.
        The session must be active and the user must have at least editor access.
      operationId: submitResponse
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseSubmission'
      responses:
        '201':
          description: Response submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreated'
        '400':
          description: Validation error (empty content, session not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Session is not active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/session-md:
    get:
      summary: Get session brief
      description: |
        Returns the structured SESSION.md brief as raw markdown.
        Auto-generated after summary creation. Returns 404 if not yet generated.
      operationId: getSessionMd
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: SESSION.md brief
          content:
            text/markdown:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/summary:
    get:
      summary: Get session summary
      description: |
        Returns the AI-generated summary for a completed session.
        Returns null summary if the session hasn't been summarized yet.
      operationId: getSessionSummary
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Session summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  summary:
                    type: string
                    nullable: true
                  generated_at:
                    type: string
                    format: date-time
                    nullable: true
                required: [session_id, summary]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Regenerate session summary
      description: |
        Regenerates the AI summary for the session and returns the refreshed
        summary. Requires editor role or above. May take up to ~90s for sessions
        with many participants (LARGE-tier synthesis).
        With no included non-preview participant answers, returns status no_data,
        a plain message, and null summary/generated_at without storing a summary.
      operationId: regenerateSessionSummary
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Regenerated session summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  summary:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum: [no_data]
                    description: Present when there are no included participant answers to summarise.
                  message:
                    type: string
                    description: Plain-language explanation of a no-data outcome.
                  generated_at:
                    type: string
                    format: date-time
                    nullable: true
                required: [session_id, summary]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/knowledge:
    post:
      summary: Generate structured session knowledge
      description: |
        Synthesises typed, structured knowledge from a session — decisions,
        action items, tensions, and atomic claims — each backed by the message
        IDs it was drawn from. When the session has grounding enabled,
        pre-extracted verbatim quotes are resolved to their source messages and
        woven in as provenance.

        The session must already have a summary (call `POST /sessions/{id}/summary`
        first). The generated knowledge is persisted on the session and returned.
        Requires **editor** access.

        Pro feature. This exposes the structured-knowledge **data layer** — there
        is no results-page UI for it yet.
      operationId: generateSessionKnowledge
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Generated (or skipped) session knowledge
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [generated, skipped]
                    description: '`generated` when knowledge was produced; `skipped` on a no-op.'
                  knowledge:
                    description: The generated knowledge, or null when skipped.
                    oneOf:
                      - $ref: '#/components/schemas/SessionKnowledge'
                      - type: 'null'
                  reason:
                    type: string
                    description: Present when `status` is `skipped`.
                required: [status, knowledge]
        '400':
          description: Session has no summary yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Session has no summary yet — generate summary first
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/scratchpad:
    post:
      summary: Seed, inspect or rebuild the listening map
      description: |
        Trigger cross-pollination scratchpad seeding or update for a session.
        The scratchpad tracks themes, emerging consensus, open tensions, and
        declared-question coverage from currently included conversations.

        **Modes:**
        - `seed` (default): Process all user messages from scratch. Resumes from
          existing progress if the session was partially seeded.
        - `update`: Process only new messages since the last update.
        - `status`: Return current scratchpad state without processing.
          Includes `eligibility_digest` for an optimistic rebuild and `needs_rebuild`.
        - `rebuild`: Discard the previous map, resume offset and accumulated
          completeness. Requires the current `expectedEligibilityDigest` from status.

        Requires editor role. The map is maintained regardless of cross-pollination;
        that setting controls injection into participant conversations.
        Changing response inclusion invalidates this map and maps seeded from it.
        Legacy maps without input receipts and maps whose context sources changed
        are withheld until deliberately refreshed. Context source versions are
        checked before analysis, publication and use in participant prompts.
        An automatic `update` cannot restart that backfill; request an explicit
        `seed` or `rebuild`. Stale in-flight writes cannot restore removed input.
        Referenced maps must be refreshed first. Session-reference cycles require
        removing a reference in the cycle before rebuilding; cyclic reconstruction
        is not supported.

        For large sessions, seeding may take multiple calls (up to 5 minutes per
        call). Each batch is persisted to the database, so partial progress
        survives timeouts. Processing stops at the first failed batch so the resume
        offset never skips missing evidence. Re-call explicitly to continue.
      operationId: seedScratchpad
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [seed, update, status, rebuild]
                  default: seed
                  description: Processing mode
                expectedEligibilityDigest:
                  type: string
                  description: Required for rebuild; use eligibility_digest from a fresh status response
      responses:
        '200':
          description: Scratchpad result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [completed, partial, no_data, busy, exists, empty]
                    description: |
                      `completed` — all messages processed.
                      `partial` — a batch failed or processing is incomplete; request continuation explicitly.
                      `no_data` — no user messages in session.
                      `busy` — another writer owns the current analysis claim.
                      `exists`/`empty` — status mode response.
                  themes:
                    type: integer
                    description: Number of themes identified
                  participants:
                    type: integer
                    description: Number of participants tracked
                  batches_processed:
                    type: integer
                    description: Batches completed in this call
                  batches_total:
                    type: integer
                    description: Total batches needed for remaining messages
                  eligibility_digest:
                    type: string
                    description: Opaque token identifying the captured conversation input and context inventory; returned in status mode
                  needs_rebuild:
                    type: boolean
                    description: Stored map has no verified current input basis and requires deliberate refresh; returned in status mode
                required: [status, themes, participants]
        '400':
          description: Invalid JSON request body or unknown processing mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Unknown scratchpad mode
        '409':
          description: Included evidence changed or an explicit rebuild is required; no stale analysis is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{id}/chat:
    post:
      summary: Send chat message
      description: |
        Send a message to a session's AI facilitator as a specific participant.
        The facilitator responds in a conversational style, guiding the participant
        through the deliberation topic. When the facilitator considers the conversation
        complete, `is_final` is set to `true`.

        This endpoint powers channel integrations (e.g. Telegram bot) where participants
        interact with the facilitator outside the web app.
      operationId: chatMessage
      tags: [Chat]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Facilitator response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Validation error (missing fields, session not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/chat/questions:
    post:
      summary: Submit pre-session answers
      description: |
        Submit answers to a session's pre-session questions and receive the
        facilitator's opening message. This starts the facilitation for the participant.

        Call this once per participant before using the `/chat` endpoint.
        The answers are passed to the facilitator as context for the conversation.
      operationId: submitChatQuestions
      tags: [Chat]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQuestionsRequest'
      responses:
        '200':
          description: Facilitator opening message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Validation error (missing fields, session not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /integrations/telegram/groups:
    get:
      summary: List Telegram groups
      description: List Telegram groups registered to the authenticated user's account.
      operationId: listTelegramGroups
      tags: [Integrations]
      responses:
        '200':
          description: List of registered Telegram groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelegramGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register a Telegram group
      description: |
        Register or update a Telegram group on the authenticated user's account.
        If the group is already registered (same user + group_id), the name and topic_id are updated.
        Called by the Telegram bot during `/setup`.
      operationId: registerTelegramGroup
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTelegramGroupRequest'
      responses:
        '201':
          description: Group registered (or updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramGroup'
        '400':
          description: Validation error (missing group_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /integrations/telegram/groups/{groupId}:
    delete:
      summary: Unregister a Telegram group
      description: Remove a Telegram group from the authenticated user's account.
      operationId: deleteTelegramGroup
      tags: [Integrations]
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
          description: Telegram group chat ID
      responses:
        '204':
          description: Group removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/grounding:
    get:
      summary: Preview response-grounding cost
      description: |
        Returns how many participant responses in the session are grounded vs.
        ungrounded, and the credit cost (in cents) to ground the remaining ones.
        No charge, no work performed.
      operationId: getGroundingPreview
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Grounding cost preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total participant responses in the session.
                  grounded:
                    type: integer
                    description: Responses that already have extracted quotes.
                  ungrounded:
                    type: integer
                    description: Responses not yet grounded.
                  cost_cents:
                    type: integer
                    description: Credit cost (cents) to ground all ungrounded responses (10¢ each).
                required: [total, grounded, ungrounded, cost_cents]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Ground ungrounded responses
      description: |
        Extracts verbatim quotes for every not-yet-grounded participant response
        and charges the session owner 10¢ per response actually grounded.
        Idempotent: already-grounded responses are skipped, so a repeat call with
        nothing new performs no work and no charge. Non-PRO callers receive 402
        if the owner's balance can't cover the estimate (no work is done).
      operationId: groundResponses
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Grounding result
          content:
            application/json:
              schema:
                type: object
                properties:
                  grounded:
                    type: integer
                    description: Responses grounded by this call.
                  attempted:
                    type: integer
                    description: Ungrounded responses found (some may have failed extraction).
                  charged_cents:
                    type: integer
                    description: Credits charged (cents). 0 on idempotent no-op or charge failure.
                  balance_after:
                    type: integer
                    nullable: true
                    description: Owner credit balance after the charge.
                  charge_failed:
                    type: boolean
                    description: Present and true if responses were grounded but the charge failed (a rare balance race); quotes are kept.
                  message:
                    type: string
                    description: Present on the idempotent no-op ("All responses already grounded").
                required: [grounded]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Insufficient credits (non-PRO owner). No responses grounded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: payment_required
                      message:
                        type: string
                  cost_cents:
                    type: integer
                  balance_cents:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/regenerate-facilitation-prompt:
    post:
      summary: Recompose facilitation prompt
      description: |
        Recomposes the facilitation prompt and Session design recap from the
        session's current layered inputs: the Brief fields (`topic`, `goal`,
        `critical`, `context`), the host's HARMONICA.md, and the active
        template's `facilitation_prompt`.

        Returns the proposed values **without persisting** them. The caller
        should present them for host confirmation, then PATCH `/sessions/{id}`
        with `prompt`, `prompt_summary`, and `prompt_generated_from` to save
        (and optionally `template_id` + `cross_pollination` on a template
        switch).

        Pass `?templateId=<id>` to override the session's current
        `template_id` for the recompose — used by the Template switcher on
        Session design tab to preview what the prompt would look like with a
        different template, before the host commits.

        Requires **editor** access on the session.
      operationId: regenerateFacilitationPrompt
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - in: query
          name: templateId
          required: false
          schema:
            type: string
          description: |
            Override the session's `template_id` for this recompose. HAR-868 —
            used by the Template switcher on Session design tab.
      responses:
        '200':
          description: Proposed facilitation prompt and recap
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilitation_prompt:
                    type: string
                    description: Regenerated facilitation prompt text.
                  prompt_summary:
                    type: string
                    description: Short Session design recap derived from the facilitation prompt.
                  prompt_generated_from:
                    type: object
                    description: Snapshot of the session fields used to generate this prompt.
                    properties:
                      topic:
                        type: string
                      goal:
                        type: string
                      critical:
                        type: string
                      context:
                        type: string
                    required: [topic, goal, critical, context]
                  template_id:
                    type: string
                    nullable: true
                    description: The `template_id` the recompose used (session's current, or the `templateId` query override).
                  cross_pollination_default:
                    type: boolean
                    nullable: true
                    description: |
                      `cross_pollination_default` on the target template. The
                      Template switcher surfaces a snap suggestion when this
                      differs from the session's current `cross_pollination`
                      setting.
                required:
                  - facilitation_prompt
                  - prompt_summary
                  - prompt_generated_from
                  - template_id
                  - cross_pollination_default
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: LLM generation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/regenerate-welcome:
    post:
      summary: Regenerate welcome message and meta description
      description: |
        Re-generates the participant-facing `welcome_message` and `meta_description`
        from the session's current `topic`, `goal`, `critical`, and `context` fields.

        Returns the proposed copy **without persisting** it. The caller should
        present it for host confirmation, then PATCH `/sessions/{id}` with
        `welcome_message` and `meta_description` to save.

        Requires **editor** access on the session.
      operationId: regenerateWelcome
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Proposed welcome message and meta description
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcome_message:
                    type: string
                    description: Participant-facing welcome copy shown on the session landing page.
                  meta_description:
                    type: string
                    description: Short description used for link previews.
                required: [welcome_message, meta_description]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: LLM generation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}/context-sources:
    get:
      summary: List project context sources
      description: |
        With no query parameters, the endpoint preserves the legacy unpaginated full
        source rows in the `{ sources, inheritedSources }` envelope; MCP bearer values
        remain redacted. Supplying `scope=project|inherited` activates compact rows
        that never include stored source content or MCP bearer values, stable cursor pagination, literal
        case-insensitive title/session-topic search, quota-class filtering, corpus-wide
        project quota counters, and batched pending-statement counts.

        Project scope is ordered by `position`, `created_at`, then `id`, ascending.
        Inherited scope is ordered by `created_at`, then `id`, ascending. Project sources
        apply to every session inside the project. Inherited sources are read-only here
        and managed on their session. No tier check on read.
      operationId: listProjectContextSources
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Project (workspace) ID.
          schema: { type: string }
        - name: scope
          in: query
          description: Activates the paginated management contract and selects one source section.
          schema:
            type: string
            enum: [project, inherited]
        - name: limit
          in: query
          description: Page size. Requires `scope`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque next-page cursor from the same scope, search, and source-class filter.
          schema: { type: string }
        - name: q
          in: query
          description: Literal case-insensitive search over source titles and inherited session topics. Requires `scope`.
          schema: { type: string, maxLength: 200 }
        - name: source_class
          in: query
          description: Filter by the same source class used for project quota accounting. Requires `scope`.
          schema:
            type: string
            enum: [meeting, static, repository, mcp]
      responses:
        '200':
          description: Project context sources
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LegacyProjectContextSourceListResponse'
                  - $ref: '#/components/schemas/ProjectContextSourceListResponse'
        '400':
          description: 'Invalid scope, limit, cursor, query, or source class'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions
  /projects/{id}/context-sources/file:
    post:
      summary: Upload a project file context source
      description: |
        Upload a file (Markdown, plain text, or PDF) as a project-level context source.
        PDFs are extracted to text via pdf2json. Files whose text is <= 50 KB are stored
        verbatim; larger files are chunked and embedded. Max 4 MB. Ordinary files and
        referenced-session snapshots share an independent 20-source project allowance.
        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: uploadProjectContextSourceFile
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Allowed types: text/plain, text/markdown, application/pdf."
                title: { type: string }
      responses:
        '201': { description: Context source created }
        '400': { description: 'Validation error (unsupported type, oversized, or a PDF with no extractable text)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient permissions or tier }
        '422': { description: Static source limit reached (20 per project) }
  /projects/{id}/context-sources/meeting:
    post:
      summary: Attach a meeting transcript as a project context source
      description: |
        Attach an owned meeting's ready transcript to a project while preserving
        meeting-level provenance and processing restrictions. Repeated attachments are
        idempotent. Meeting transcript sources have an independent 50-source project
        allowance. Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: addProjectContextSourceMeeting
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meeting_id]
              properties:
                meeting_id:
                  type: string
                  description: ID of an owned meeting whose transcript is ready.
                title: { type: string }
      responses:
        '200':
          description: Existing ready meeting source returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingAttachmentSource' }
        '201':
          description: Meeting transcript source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingAttachmentSource' }
        '202':
          description: Existing meeting source is still processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingAttachmentSource' }
        '400': { description: 'Validation error or meeting transcript source limit reached (50 per project)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Insufficient permissions, tier, or meeting processing restricted' }
        '404': { description: Meeting or transcript not found }
  /projects/{id}/context-sources/meetings:
    post:
      summary: Attach meeting transcripts to a project in a bounded batch
      description: |
        Attach between 1 and 50 owned meetings. Work is processed with bounded
        concurrency and results retain request order. Every requested item receives
        an independent outcome, so valid items continue when another item is invalid,
        unavailable, restricted, over quota, or fails. Repeated meeting IDs and
        partial retries are idempotent and return the existing source. Knowledge
        extraction is scheduled after the response with separately bounded concurrency.
        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: addProjectContextSourceMeetings
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meetings:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/MeetingAttachmentBatchItem' }
              required: [meetings]
      responses:
        '200':
          description: Ordered per-item attachment outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingAttachmentBatchResponse'
        '400': { description: 'Invalid outer batch request: malformed JSON, empty meetings, or more than 50 items' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient project permissions or subscription tier }
  /projects/{id}/context-sources/session:
    post:
      summary: Reference a session as a project context source
      description: |
        Attach a snapshot of another session's SESSION.md as shared context for the project. The source session stays in its current project, and changes to its SESSION.md do not automatically update the copy.

        Use a Harmonica API key with editor access on the destination project and viewer access on the source session. The account must have context-source access (Pro, LTD, or Enterprise). The source needs a SESSION.md eligible to be copied under the source session's current sharing and contribution settings.

        This REST operation is available to integrations. To add a reference to one session in the app, use its Sources panel. Project-wide references share the project's 20-source static allowance with ordinary files.
      operationId: addProjectContextSourceSession
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ref]
              properties:
                source_ref:
                  type: string
                  description: ID of the session whose SESSION.md to snapshot.
                title:
                  type: string
                  description: Display title. Defaults to the source session's topic or ID.
            example:
              source_ref: hst_source_session
              title: Prior workshop brief
      responses:
        '201': { description: Project context source created. Returns its ID and metadata. }
        '400': { description: 'Invalid request or source SESSION.md unavailable for copying' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Insufficient project permissions, source permissions, or context-source access' }
        '422': { description: Static source limit reached (20 per project) }
  /projects/{id}/context-sources/mcp:
    post:
      summary: Register an MCP server as a project context source
      description: |
        Register an MCP server at the project level. Performs a handshake to enumerate
        tools and validates any allowlist. MCP connections have an independent 20-source
        project allowance. Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: addProjectContextSourceMcp
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title]
              properties:
                url: { type: string }
                title: { type: string }
                bearer: { type: string, nullable: true }
                tool_allowlist:
                  type: array
                  items: { type: string }
                  nullable: true
      responses:
        '201': { description: Context source created }
        '400': { description: Validation error (handshake failed or allowlist mismatch) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient permissions or tier }
        '422': { description: MCP connection limit reached (20 per project) }
  /projects/{id}/context-sources/{source_id}:
    patch:
      summary: Update a project context source
      description: |
        Update a project context source's title, position, mcp_config, or a single
        knowledge-curation toggle. Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: updateProjectContextSource
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                position: { type: integer }
                mcp_config: { type: object }
                curation:
                  type: object
                  description: |
                    Toggle one extracted-knowledge item's keep/drop/pin status,
                    merged into the source's curation map (status `kept` removes the
                    override). Kept + pinned items feed facilitation instead of the
                    raw transcript; pinned sorts first.
                  properties:
                    itemId: { type: string }
                    status: { type: string, enum: [kept, pinned, dropped] }
                  required: [itemId, status]
      responses:
        '200': { description: Updated source }
        '400': { description: No fields to update }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient permissions or tier }
        '404': { description: Source not found in this project }
    delete:
      summary: Delete a project context source
      description: |
        Delete a project context source. Cascades to session_embeddings via FK.
        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: deleteProjectContextSource
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient permissions or tier }
        '404': { description: Source not found }
  /projects/{id}/context-sources/{source_id}/refresh:
    post:
      summary: Refresh a project context source
      description: |
        Re-snapshot a session reference or re-handshake an MCP source at the project
        level. File sources cannot be refreshed (re-upload required). Requires a Pro,
        LTD, or ENTERPRISE subscription.
      operationId: refreshProjectContextSource
      tags: [Context Sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Refreshed source }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient permissions or tier }
        '404': { description: Source not found }
        '422': { description: File sources cannot be refreshed }
  /sessions/{id}/context-sources/file:
    post:
      summary: Upload a file context source
      description: |
        Upload a file (Markdown, plain text, or PDF) as a context source for the session.
        PDFs are extracted to text via pdf2json; the extracted text then follows the same size
        rule. Files whose text is ≤ 50 KB are stored verbatim in the source row; larger files
        are chunked and embedded into `session_embeddings` for vector search. A PDF with no
        extractable text layer (scanned / image-only) is rejected with a 400.

        Allowed MIME types: `text/markdown`, `text/plain`, `application/pdf`.
        Maximum file size: 4 MB (Vercel route body limit).
        Maximum sources per session: 20.

        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: uploadContextSourceFile
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "File to upload. Allowed types: text/plain, text/markdown, application/pdf."
                title:
                  type: string
                  description: |
                    Human-readable title for the source. Defaults to the file name if omitted.
      responses:
        '201':
          description: Context source created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique ID of the new context source row.
                  session_id:
                    type: string
                    format: uuid
                  source_type:
                    type: string
                    enum: [file]
                  title:
                    type: string
                  content_mode:
                    type: string
                    enum: [verbatim, chunked]
                    description: |
                      `verbatim` — full text stored in the row; `chunked` — text split and
                      embedded in `session_embeddings` for vector retrieval.
                  created_at:
                    type: string
                    format: date-time
                required: [id, session_id, source_type, title, content_mode, created_at]
        '400':
          description: |
            Validation error — missing file, oversized, unsupported MIME type, or a PDF with
            no extractable text layer (scanned / image-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: 'Unsupported file type: image/png (filename: chart.png). Allowed: .md, .markdown, .txt, .pdf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: Context sources require a Pro subscription
        '422':
          description: Source cap reached (20 per session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Source cap reached (20 per session)
        '500':
          description: Ingestion or embedding failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/context-sources:
    get:
      summary: List context sources
      description: |
        Returns all context sources attached to the session, ordered by position then created_at.
        No tier requirement — read path is unconditional.
      operationId: listContextSources
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: List of context sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{id}/context-sources/session:
    post:
      summary: Add a session reference as a context source
      description: |
        Snapshot another session's SESSION.md and add it as a context source.
        The content is captured at add-time (not live). Use `/refresh` to re-snapshot.

        The caller must have at least **viewer** access on the source session.
        Requires a Pro, LTD, or ENTERPRISE subscription.
        Maximum 20 sources per session.
      operationId: addSessionContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ref]
              properties:
                source_ref:
                  type: string
                  format: uuid
                  description: ID of the session whose SESSION.md to snapshot.
                title:
                  type: string
                  description: |
                    Human-readable title. Defaults to the source session's topic if omitted.
      responses:
        '201':
          description: Context source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '400':
          description: Validation error (missing source_ref, source has no SESSION.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier, or no access to source session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Source cap reached (20 per session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/context-sources/url:
    post:
      summary: Add a web page (URL) as a context source
      description: |
        Fetch a web page, scrape it to markdown, and add it as a context source.
        The page is captured as a snapshot at add-time (`source_ref` holds the URL).
        Use `/refresh` to re-scrape the latest version.

        Requires a Pro, LTD, or ENTERPRISE subscription.
        Maximum 20 sources per session.
      operationId: addUrlContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: The http/https URL of the page to scrape. Private/local addresses are rejected.
                title:
                  type: string
                  description: Human-readable title. Defaults to the scraped page title if omitted.
      responses:
        '201':
          description: URL context source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '400':
          description: Validation error (missing/invalid URL, blocked host, empty/unreachable page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Source cap reached (20 per session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/context-sources/mcp:
    post:
      summary: Add an MCP server as a context source
      description: |
        Perform an MCP handshake, enumerate available tools, and register the server
        as a context source. The tool list is cached in `mcp_config.cached_tools`.
        Use `/refresh` to re-enumerate tools when the server changes.

        Requires a Pro, LTD, or ENTERPRISE subscription.
        Maximum 20 sources per session.
      operationId: addMcpContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title]
              properties:
                url:
                  type: string
                  format: uri
                  description: SSE endpoint of the MCP server.
                bearer:
                  type: string
                  nullable: true
                  description: Optional Bearer token for authenticated MCP servers.
                tool_allowlist:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: |
                    If provided, only these tools will be used. All listed tools must exist
                    on the server or the request fails with 400.
                title:
                  type: string
                  description: Human-readable name for this MCP source.
      responses:
        '201':
          description: MCP context source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '400':
          description: Validation error (missing fields, allowlist mismatch, handshake failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: "MCP server doesn't expose allowlisted tools: missing_tool"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Source cap reached (20 per session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/context-sources/{source_id}:
    patch:
      summary: Update a context source
      description: |
        Update a context source's title, position, mcp_config, or a single
        knowledge-curation toggle. At least one field must be provided.
        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: updateContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Context source ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: New display title.
                position:
                  type: integer
                  description: New sort position (lower = earlier in prompt).
                mcp_config:
                  type: object
                  description: Partial MCP config override (advanced use).
                curation:
                  type: object
                  description: |
                    Toggle one extracted-knowledge item's keep/drop/pin status
                    (HAR-1155), merged into the source's curation map (status `kept`
                    removes the override). Kept + pinned items feed facilitation
                    instead of the raw transcript; pinned sorts first.
                  properties:
                    itemId: { type: string }
                    status: { type: string, enum: [kept, pinned, dropped] }
                  required: [itemId, status]
      responses:
        '200':
          description: Updated context source row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '400':
          description: Validation error (no fields to update, invalid body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a context source
      description: |
        Permanently delete a context source.
        Cascades to associated `session_embeddings` rows (file chunks).
        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: deleteContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Context source ID
      responses:
        '204':
          description: Deleted (no body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/context-sources/{source_id}/refresh:
    post:
      summary: Refresh a context source
      description: |
        Re-fetch content for a session, MCP, or URL context source.
        - **session** sources: re-snapshot the source session's SESSION.md.
        - **mcp** sources: re-handshake the MCP server and update `cached_tools`.
        - **url** sources: re-scrape the page from `source_ref`.
        - **file** sources: not supported — re-upload via POST /file instead (returns 422).

        Requires a Pro, LTD, or ENTERPRISE subscription.
      operationId: refreshContextSource
      tags: [Context Sources]
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Context source ID
      responses:
        '200':
          description: Updated context source row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '400':
          description: Ingest failure (e.g. source session no longer has SESSION.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions or tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: File sources cannot be refreshed — re-upload required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unprocessable
                  message: Re-upload to refresh file content

  /sessions/{id}/edit-history:
    get:
      summary: Get host_db edit history for a session
      description: HAR-861 — returns revision rows for tracked host_db fields. Editor role required.
      operationId: getSessionEditHistory
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - in: query
          name: field
          schema:
            type: string
          description: Filter to a single field (e.g., 'prompt', 'goal').
      responses:
        '200':
          description: revisions + per-field counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        field:
                          type: string
                        value:
                          type: string
                        source:
                          type: string
                          enum: [manual_edit, brief_drift_cascade, template_switch, stall_review_apply, create_session]
                        created_at:
                          type: string
                          format: date-time
                        created_by:
                          type: [string, 'null']
                      required: [id, field, value, source, created_at, created_by]
                  counts:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count:
                          type: integer
                        last_edited:
                          type: string
                          format: date-time
                      required: [count, last_edited]
                required: [revisions, counts]
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
