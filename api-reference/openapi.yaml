  /sessions:
    post:
      summary: Create session
      description: |
        Creates a new deliberation session owned by the authenticated user.
        If `prompt` is omitted, a facilitation prompt is auto-generated server-side
        from the topic, goal, context, and critical fields (with a fallback to a basic prompt).
        Returns the created session with a `join_url` for sharing with participants.
      operationId: createSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          description: Validation error (missing required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: topic is required
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List sessions
      description: |
        Returns sessions the authenticated user has access to (owns or participates in).
        API keys remain account-scoped by default. A key created by a current global
        admin with the explicit `platform_sessions:read_metadata` capability may pass
        `scope=platform` to list platform-wide session metadata. That capability does
        not grant access to per-session reads, participant responses, or mutations.
        Results are ordered by most recently updated first.
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
          description: Filter by session status
        - name: q
          in: query
          schema:
            type: string
          description: Search sessions by topic or goal
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip
        - name: scope
          in: query
          schema:
            type: string
            enum: [account, platform]
            default: account
          description: |
            Listing scope. `platform` requires both an explicitly capable API key
            and a current global-admin grant for its owner.
        - name: distribution_channel
          in: query
          schema:
            type: string
            enum: [telegram]
          description: Filter by distribution channel
        - name: distribution_group_id
          in: query
          schema:
            type: string
          description: Filter by distribution group ID
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionListItem'
                  pagination:
                    allOf:
                      - $ref: '#/components/schemas/Pagination'
                      - type: object
                        properties:
                          scope:
                            type: string
                            enum: [account, platform]
                        required: [scope]
                required: [data, pagination]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Platform scope requires a specifically authorized admin API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}:
    get:
      summary: Get session
      description: Returns full details of a session the user has access to.
      operationId: getSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update session
      description: |
        Update session metadata. At least one field must be provided.
        Requires editor role or higher on the session.
      operationId: updateSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_links_enabled:
                  type: boolean
                  nullable: true
                  description: Enable reading participant-pasted web links as shared session sources. Null restores the enabled default.
                topic:
                  type: string
                goal:
                  type: string
                context:
                  type: string
                critical:
                  type: string
                prompt:
                  type: string
                  description: Custom facilitation prompt for the AI facilitator
                project_id:
                  type: string
                  nullable: true
                  description: |
                    Move the session into a project, or pass null to detach it
                    from all projects. Requires editor access to the target
                    project.
                results_visibility:
                  type: string
                  enum: [public, participants, community, host]
                  description: |
                    Who can see aggregated session results. See
                    `CreateSessionRequest.results_visibility` for the first
                    three tiers.

                    `community` opens results to members of the organization
                    the session's project is bound to, in addition to the
                    people who took part — it is additive, never a
                    replacement. It is validated against the project the
                    session will LAND in, so sending it together with a
                    `project_id` that is not bound to an organization, or with
                    `project_id: null`, is rejected with `validation_error`.
              minProperties: 1
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Validation error (no valid fields provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: "No valid fields provided. Allowed fields: topic, goal, context, critical, prompt, project_id"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/close:
    post:
      summary: Close session
      description: |
        Close a session so new participant activity is no longer accepted.
        Requires editor access or higher. The operation is idempotent and changes
        only the session's active status; participant threads, messages, summaries,
        and other session data are preserved.
      operationId: closeSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Closed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/reopen:
